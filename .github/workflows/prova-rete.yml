name: Prova rete

on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Come chiama l'API il portale
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) Chrome/124 Safari/537.36"
          curl -sSL -4 --max-time 60 -A "$UA" -o main.js https://carburanti.mise.gov.it/ospzSearch/main.ee9a1e3529ef567bca33.js
          ls -l main.js
          python3 - <<'PY'
          import re
          s=open('main.js',encoding='utf-8',errors='replace').read()
          seen=0
          for pat in [r'search/area', r'search/zone', r'priceOrder', r'fuelType"?:', r'radius']:
              for m in list(re.finditer(pat,s))[:2]:
                  a=max(0,m.start()-250); b=min(len(s),m.end()+450)
                  print('--- ['+pat+']'); print(s[a:b].replace('\n',' '))
          PY
